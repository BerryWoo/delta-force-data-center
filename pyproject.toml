[project]
name = "delta-force-data-center"
version = "0.1.0"
description = "Delta Force Data Center - 三角洲行动数据分析中心"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.scripts]
delta-force-data-center = "src.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
